<style>
:root{
  --bg:#F4F5F6; --surface:#FFFFFF; --ink:#121212; --muted:#5E6368; --line:#D9DCDF;
  --blue:#1B4F8F; --blue-soft:#E9EFF7; --on-blue:#FFFFFF; --danger:#9A2B2B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#121316; --surface:#1A1C20; --ink:#ECEDEE; --muted:#A0A5AC; --line:#2C2F35;
    --blue:#7FAEE6; --blue-soft:#1E2836; --on-blue:#0E1620; --danger:#E59090;
  }}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#1A1C20; --ink:#ECEDEE; --muted:#A0A5AC; --line:#2C2F35;
  --blue:#7FAEE6; --blue-soft:#1E2836; --on-blue:#0E1620; --danger:#E59090;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Jost","Century Gothic","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%;
}
button,input{font:inherit;color:inherit;}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 64px;}
/* topo */
.mast{display:flex;align-items:center;gap:14px;padding:18px 0 8px;}
.tabs{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line);}
@media (max-width:420px){.tab{padding:12px 9px;font-size:.95rem;}}
.tab{background:none;border:0;padding:12px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab:hover{color:var(--ink);}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:6px;}
.tab[aria-current=page]{color:var(--ink);font-weight:500;border-bottom-color:var(--blue);}
.mast img{width:54px;height:54px;border-radius:50%;flex:none;background:#fff;display:block;}
.mast .nome{font-weight:500;font-size:1.08rem;line-height:1.2;}
.mast .sub{color:var(--muted);font-size:.9rem;line-height:1.3;}
/* início */
.hero h1{font-weight:300;font-size:clamp(2.1rem,6.5vw,3.4rem);letter-spacing:-.015em;line-height:1.1;margin:44px 0 12px;}
.lead{color:var(--muted);max-width:52ch;margin:0 0 26px;}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.empty{padding:40px 20px;text-align:center;color:var(--muted);}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;color:var(--muted);margin-top:20px;}
.ic{display:inline-flex;}
/* janelas */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);z-index:50;}
.news{padding:22px 22px 24px;border-top:1px solid var(--line);}
.news:first-child{border-top:0;}
.news-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;min-height:30px;}
.tag{border:1px solid var(--blue);color:var(--blue);border-radius:99px;padding:1px 11px;font-size:.84rem;}
.news-title{font-weight:500;font-size:1.4rem;line-height:1.25;margin:6px 0 4px;overflow-wrap:anywhere;}
.news-when{display:flex;flex-wrap:wrap;gap:0 20px;margin:0 0 8px;color:var(--ink);font-weight:500;font-size:.98rem;}
.news-text{margin:8px 0 0;white-space:pre-line;max-width:68ch;overflow-wrap:anywhere;}
.more{display:flex;justify-content:center;margin-top:18px;}
.sobre{max-width:64ch;white-space:pre-line;margin:0 0 26px;color:var(--ink);}
.membros{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
.member{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 18px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;}
.avatar{width:124px;height:124px;border-radius:50%;border:1px solid var(--line);padding:6px;display:grid;place-items:center;overflow:hidden;flex:none;}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
.initials{width:100%;height:100%;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:2.1rem;font-weight:300;}
.m-name{font-weight:500;font-size:1.15rem;line-height:1.25;margin:16px 0 2px;overflow-wrap:anywhere;}
.m-role{margin:0;color:var(--blue);font-weight:500;}
.m-course{margin:2px 0 0;color:var(--muted);font-size:.9rem;}
.m-bio{margin:10px 0 0;font-size:.92rem;overflow-wrap:anywhere;}
.m-contact{margin:8px 0 0;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere;}
.produtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
.produto{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.p-img{display:block;width:100%;aspect-ratio:4/3;padding:0;border:0;background:var(--blue-soft);cursor:zoom-in;}
.p-img:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;}
.p-img img{width:100%;height:100%;object-fit:cover;display:block;}
.p-ph{display:grid;place-items:center;width:100%;aspect-ratio:4/3;background:var(--blue-soft);color:var(--blue);font-size:3.2rem;font-weight:300;}
.p-body{padding:16px;display:flex;flex-direction:column;flex:1;}
.p-name{font-weight:500;font-size:1.2rem;line-height:1.25;margin:0 0 6px;overflow-wrap:anywhere;}
.p-desc{margin:0 0 16px;color:var(--muted);font-size:.95rem;white-space:pre-line;overflow-wrap:anywhere;flex:1;}
.p-price{text-align:center;border:1px solid var(--blue);background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:10px 14px;font-size:1.85rem;font-weight:500;line-height:1.1;letter-spacing:-.01em;}
.drive-btn{display:flex;align-items:center;gap:20px;width:100%;max-width:640px;padding:28px 30px;background:var(--blue);color:var(--on-blue);border:1px solid var(--blue);border-radius:16px;text-decoration:none;transition:filter .15s;}
.drive-btn:hover{filter:brightness(1.1);}
.drive-btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}
.drive-ic{flex:none;}
.drive-ic svg{width:48px;height:48px;stroke-width:1.4;}
.drive-txt{display:flex;flex-direction:column;min-width:0;}
.drive-main{font-size:clamp(1.4rem,4.5vw,1.9rem);font-weight:500;line-height:1.2;}
.drive-sub{font-size:.95rem;opacity:.85;margin-top:3px;}
.drive-fallback{max-width:640px;margin:16px 0 0;color:var(--muted);font-size:.88rem;}
.drive-url{display:block;margin-top:4px;word-break:break-all;user-select:all;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}
.lb{position:relative;max-width:min(1000px,100%);max-height:100%;display:flex;}
.lb img{max-width:100%;max-height:calc(100vh - 48px);object-fit:contain;border-radius:10px;background:var(--surface);display:block;}
.lb-close{position:absolute;top:8px;right:8px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;display:grid;place-items:center;}
.lb-close:focus-visible{outline:2px solid #fff;outline-offset:2px;}

.news-img{display:block;margin:12px 0 4px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:zoom-in;max-width:100%;}
.news-img:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.news-img img{display:block;max-width:100%;max-height:480px;height:auto;width:auto;}
.more-btn{display:inline-flex;align-items:center;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.2;}
.more-btn:hover{border-color:var(--blue);}
.more-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

</style>

(function(){
'use strict';

var $app = document.getElementById('app');

function h(tag, props){
  var el = document.createElement(tag);
  var p = props || {};
  Object.keys(p).forEach(function(k){
    var v = p[k];
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  var kids = Array.prototype.slice.call(arguments, 2);
  (function add(list){
    list.forEach(function(kid){
      if (kid == null || kid === false) return;
      if (Array.isArray(kid)) return add(kid);
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
  })(kids);
  return el;
}

var SVG = {
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>'
};
function icon(name, cls){
  var s = document.createElement('span');
  s.className = 'ic' + (cls ? ' ' + cls : '');
  s.setAttribute('aria-hidden', 'true');
  s.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + SVG[name] + '</svg>';
  return s;
}

function lista(x){ return Array.isArray(x) ? x : []; }
function imgSrc(ref){
  if (!ref) return '';
  return (typeof IMAGENS !== 'undefined' && IMAGENS[ref]) ? IMAGENS[ref] : String(ref);
}
function parsePreco(v){
  if (typeof v === 'number') return isFinite(v) && v >= 0 ? Math.round(v * 100) : null;
  var x = String(v == null ? '' : v).replace(/R\$/gi, '').replace(/\s/g, '');
  if (!x) return null;
  if (x.indexOf(',') >= 0) x = x.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(x)) return null;
  return Math.round(Number(x) * 100);
}
function fmtPreco(c){
  try { return (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  catch (e) { return 'R$ ' + (c / 100).toFixed(2).replace('.', ','); }
}

var route = 'inicio';
var newsLimit = 10;
function parseHash(){
  var hsh = location.hash || '';
  if (hsh === '#/drive') return 'drive';
  if (hsh === '#/produtos') return 'produtos';
  if (hsh === '#/quem-somos') return 'quem';
  return 'inicio';
}
var TABHASH = { inicio: '#/inicio', drive: '#/drive', produtos: '#/produtos', quem: '#/quem-somos' };
function go(tab){
  try { location.hash = TABHASH[tab]; } catch (e) {}
  route = tab; render(); window.scrollTo(0, 0);
}

/* ---------- imagem ampliada ---------- */
function ampliar(src, titulo){
  var prev = document.activeElement;
  var closeBtn = h('button', { class: 'lb-close', type: 'button', 'aria-label': 'Fechar', onclick: close }, icon('close'));
  var ov = h('div', { class: 'overlay', onmousedown: function(e){ if (e.target === ov) close(); } },
    h('div', { class: 'lb', role: 'dialog', 'aria-modal': 'true', 'aria-label': titulo }, closeBtn, h('img', { src: src, alt: titulo })));
  function onKey(e){ if (e.key === 'Escape') close(); }
  function close(){
    ov.remove(); document.removeEventListener('keydown', onKey);
    if (prev && prev.focus) { try { prev.focus(); } catch (e) {} }
  }
  document.addEventListener('keydown', onKey);
  document.body.append(ov);
  closeBtn.focus();
}

function hero(titulo, lead){
  return h('section', { class: 'hero' }, h('h1', {}, titulo), lead ? h('p', { class: 'lead' }, lead) : null);
}
function vazio(msg){ return h('div', { class: 'list' }, h('div', { class: 'empty' }, msg)); }

/* ---------- Início ---------- */
function noticiaEl(n){
  var meta = [n.quando, n.local].filter(Boolean).map(function(x){ return h('span', {}, x); });
  var src = imgSrc(n.imagem);
  return h('article', { class: 'news' },
    h('div', { class: 'news-top' },
      n.tipo ? h('span', { class: 'tag' }, n.tipo) : null,
      n.publicadoEm ? h('span', {}, 'Publicado em ' + n.publicadoEm) : null),
    h('h2', { class: 'news-title' }, n.titulo || ''),
    meta.length ? h('p', { class: 'news-when' }, meta) : null,
    src ? h('button', { class: 'news-img', type: 'button', 'aria-label': 'Ampliar a imagem de ' + (n.titulo || 'notícia'),
      onclick: function(){ ampliar(src, n.titulo || 'Imagem'); } },
      h('img', { src: src, alt: 'Imagem da notícia ' + (n.titulo || ''), loading: 'lazy',
        onerror: function(e){ var b = e.target.parentNode; if (b) b.remove(); } })) : null,
    n.texto ? h('p', { class: 'news-text' }, n.texto) : null);
}
function viewInicio(){
  var wrap = h('div', {});
  wrap.append(hero('Notícias do CAEG', 'Palestras, visitas e avisos do centro acadêmico.'));
  var ns = lista(CONTEUDO.noticias);
  if (!ns.length){ wrap.append(vazio('Ainda não há notícias. Volte em breve.')); return wrap; }
  var list = h('div', { class: 'list' });
  ns.slice(0, newsLimit).forEach(function(n){ list.append(noticiaEl(n)); });
  wrap.append(list);
  if (ns.length > newsLimit){
    wrap.append(h('div', { class: 'more' }, h('button', { class: 'more-btn', type: 'button', onclick: function(){ newsLimit += 10; render(); } }, 'Ver notícias anteriores')));
  }
  return wrap;
}

function viewDrive(){

      h('span', { class: 'drive-main' }, 'Abrir o Drive de Estudos'),
      h('span', { class: 'drive-sub' }, 'Abre o Google Drive em uma nova aba'))));
  wrap.append(h('p', { class: 'drive-fallback' }, 'Se o botão não abrir, copie este endereço:', h('span', { class: 'drive-url' }, url)));
  return wrap;
}

/* ---------- Produtos ---------- */
function inicial(nome){ return (String(nome || '?').trim().charAt(0) || '?').toUpperCase(); }
function produtoEl(p){
  var src = imgSrc(p.imagem);
  var centavos = parsePreco(p.preco);
  var media;
  function placeholder(){ return h('div', { class: 'p-ph', 'aria-hidden': 'true' }, inicial(p.nome)); }
  if (src){
    media = h('button', { class: 'p-img', type: 'button', 'aria-label': 'Ampliar a imagem de ' + (p.nome || 'produto'),
      onclick: function(){ ampliar(src, p.nome || 'Produto'); } },
      h('img', { src: src, alt: p.nome || '', loading: 'lazy',
        onerror: function(e){ var b = e.target.parentNode; if (b) b.replaceWith(placeholder()); } }));
  } else media = placeholder();
  return h('article', { class: 'produto' }, media,
    h('div', { class: 'p-body' },
      h('h2', { class: 'p-name' }, p.nome || ''),
      p.descricao ? h('p', { class: 'p-desc' }, p.descricao) : h('div', { style: 'flex:1' }),
      centavos !== null ? h('div', { class: 'p-price', 'aria-label': 'Preço: ' + fmtPreco(centavos) }, fmtPreco(centavos)) : null));
}
function viewProdutos(){
  var wrap = h('div', {});
  wrap.append(hero('Produtos do CAEG', 'Compra através dos membros do CAEG.'));
  var ps = lista(CONTEUDO.produtos);
  if (!ps.length){ wrap.append(vazio('Ainda não há produtos. Volte em breve.')); return wrap; }
  var grid = h('div', { class: 'produtos' });
  ps.forEach(function(p){ grid.append(produtoEl(p)); });
  wrap.append(grid);
  return wrap;
}

/* ---------- Quem nós somos ---------- */
function iniciais(nome){
  var p = String(nome || '').trim().split(/\s+/).filter(Boolean);
  var s = p.length ? p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '') : '?';
  return h('span', { class: 'initials', 'aria-hidden': 'true' }, s.toUpperCase());
}
function membroEl(m){
  var src = imgSrc(m.foto);
  var av = h('div', { class: 'avatar' });
  if (src){
    av.append(h('img', { src: src, alt: 'Foto de ' + (m.nome || 'membro'), loading: 'lazy',
      onerror: function(e){ var img = e.target; var pai = img.parentNode; img.remove(); if (pai) pai.append(iniciais(m.nome)); } }));
  } else av.append(iniciais(m.nome));
  return h('article', { class: 'member' }, av,
    h('h2', { class: 'm-name' }, m.nome || ''),
    m.cargo ? h('p', { class: 'm-role' }, m.cargo) : null,
    m.curso ? h('p', { class: 'm-course' }, m.curso) : null,
    m.bio ? h('p', { class: 'm-bio' }, m.bio) : null,
    m.contato ? h('p', { class: 'm-contact' }, m.contato) : null);
}
function viewQuem(){
  var wrap = h('div', {});
  wrap.append(hero('Quem nós somos'));
  if (CONTEUDO.sobre) wrap.append(h('p', { class: 'sobre' }, CONTEUDO.sobre));
  else wrap.append(h('div', { style: 'height:6px' }));
  var ms = lista(CONTEUDO.membros);
  if (!ms.length){ wrap.append(vazio('Os membros serão apresentados aqui em breve.')); return wrap; }
  var grid = h('div', { class: 'membros' });
  ms.forEach(function(m){ grid.append(membroEl(m)); });
  wrap.append(grid);
  return wrap;
}

/* ---------- montagem ---------- */
function render(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    if (b.getAttribute('data-tab') === route) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  var v = route === 'drive' ? viewDrive() : route === 'produtos' ? viewProdutos() : route === 'quem' ? viewQuem() : viewInicio();
  $app.replaceChildren(v);
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
  b.addEventListener('click', function(){ go(b.getAttribute('data-tab')); });
});
window.addEventListener('hashchange', function(){ route = parseHash(); render(); window.scrollTo(0, 0); });
function start(){ route = parseHash(); render(); }
/* espera o arquivo inteiro carregar, para as IMAGENS (no fim) já existirem */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
